<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For you...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000814;
            color: #00d4ff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            min-height: 300vh; /* Extra height for better scrolling */
        }

        /* START OVERLAY */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000814;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        #start-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: 'Courier New', Courier, monospace;
            background: transparent;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            transition: all 0.3s ease;
        }

        #start-btn:hover {
            background: #00d4ff;
            color: #000814;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }

        #heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 10;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0; /* Hidden until button is clicked */
            transition: opacity 1s ease;
        }

        .para {
            margin-bottom: 400px; /* Increased space for a better scroll feel */
            font-size: 1.8rem;
            text-align: center;
            max-width: 900px;
            min-height: 1.2em;
        }

        .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .char.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .char.space {
            width: 0.35em;
        }

        .heart {
            position: fixed;
            top: -10%;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* Responsive font for mobile */
        @media (max-width: 600px) {
            .para { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="Saja_Boys_Ft_Andrew_Choi_neckwav_Danny_Chung_Kevin_Woo_SamUIL_KPop_Demon_Hunters_Cast_-_Soda_Pop_thinknews.com.ng.mp3" type="audio/mpeg">
    </audio>

    <div id="overlay">
        <button id="start-btn">Click here to begin experience</button>
    </div>

    <div id="heart-container"></div>

    <div class="content" id="main-content">
        <div class="para" style="margin-top: 20vh;" data-text="Scroll down slowly!"></div>
        <div class="para" data-text="Hi karishuu!! How you doing? Enjoying without me ah??"></div>
        <div class="para" data-text="I really miss you a lot. I talk about us to mum everyday. She really got bored of our stories together..."></div>
        <div class="para" data-text="I want to text you and call you but you know I'm not that free to do those especially with parents around me we can't talk casually and freely like we do in school... which turned from routine to memories.."></div>
        <div class="para" data-text="I made this specially for you... If u like this, send a blue heart!!"></div>
        <div class="para" data-text="I'll always cherish our memories together... YOURS, JAN PATTU"></div>
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const music = document.getElementById('bg-music');
        const content = document.getElementById('main-content');

        // Start everything on button click
        startBtn.addEventListener('click', () => {
            overlay.style.opacity = '0';
            content.style.opacity = '1';
            setTimeout(() => {
                overlay.style.display = 'none';
                music.play();
                startHeartRain(); // Hearts start after click
            }, 1000);
        });

        // 1. HEART RAIN LOGIC
        function createHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '💙';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 15 + 10 + "px";
            heart.style.opacity = Math.random();
            const duration = Math.random() * 3 + 3;
            heart.style.animationDuration = duration + "s";
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, duration * 1000);
        }

        function startHeartRain() {
            setInterval(createHeart, 150);
        }

        // 2. TYPEWRITER SETUP
        const paragraphs = document.querySelectorAll('.para');
        paragraphs.forEach(p => {
            const text = p.getAttribute('data-text');
            p.innerHTML = ''; 
            text.split('').forEach(char => {
                const span = document.createElement('span');
                span.classList.add('char');
                if (char === ' ') span.classList.add('space');
                span.textContent = char;
                p.appendChild(span);
            });
        });

        // 3. SCROLL OBSERVER
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const chars = entry.target.querySelectorAll('.char');
                    chars.forEach((char, index) => {
                        setTimeout(() => {
                            char.classList.add('visible');
                        }, index * 50); 
                    });
                }
            });
        }, { threshold: 0.2 });

        paragraphs.forEach(p => observer.observe(p));
    </script>
</body>
</html>
